seed: 42
name: torch_gat

data:
  nodes: dataset/node_features.csv
  edges: dataset/edges.csv
  id_column: username
  target_column: target_rating
  feature_columns:
    - acpl
    - accuracy
    - num_moves
    - frac_blunders
    - frac_mistakes
    - frac_inaccuracies
    # - avg_move_time # TODO needs to handle inf
    - last_theory_ply
    - win_streak
    - loss_streak
    - num_games
    - win_rate
    - loss_rate
    - draw_rate
  edge_feature_columns:
    - points

graph:
  directed: true
  add_self_loops: true

# TODO: use consistent split that avoids any leakage
split:
  method: random
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

# https://pytorch-geometric.readthedocs.io/en/2.4.0/generated/torch_geometric.nn.models.GAT.html
model:
  hidden_channels: 128
  out_channels: 1
  num_layers: 3
  v2: True
  dropout: 0.20
  act: "relu"
  act_first: False
  heads: 4
  use_edge_features: true

training:
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 50
  gradient_clip_norm: 1.0
  loss: huber
  huber_delta: 1.0

output:
  directory: runs
