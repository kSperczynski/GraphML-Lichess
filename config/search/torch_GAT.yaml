n_trials: 40
params:
  model.hidden_channels: {type: categorical, choices: [32, 64, 128, 256]}
  model.heads:           {type: categorical, choices: [2, 4, 8]}
  model.num_layers:      {type: int, low: 1, high: 4}
  model.dropout:         {type: float, low: 0.0, high: 0.7}
  training.learning_rate: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  training.weight_decay:  {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
