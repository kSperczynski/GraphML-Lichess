n_trials: 400
params:
  model.mp_latent_features: {type: categorical, choices: [20, 32, 64, 128]}
  model.mp_output_features: {type: categorical, choices: [14, 20, 32, 64]}
  model.num_mp_layers: {type: categorical, choices: [3, 4, 5, 6]}
  model.num_nodewise_layers: {type: categorical, choices: [1,2]}
  training.learning_rate: {type: float, low: 1.0e-2, high: 3.0, log: true}
  training.weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
