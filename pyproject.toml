[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphml_lichess"]

[project]
name = "graphml-lichess"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torch-geometric>=2.8.0.post1",
    "seaborn>=0.13.0",
    "pygod>=1.1.0"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9",
    "ruff>=0.16.10",
]

[project.scripts]
graphml-lichess = "graphml_lichess.cli:cli"
graphml-experiments = "graphml_lichess.analysis.__main__:main"

[tool.ruff]
exclude = [".venv"]
line-length = 125
